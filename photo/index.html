---
layout: default
title: photo
index: true
---
<div class="cardgrid">
    {% assign photos = site.pages | where_exp: "item", "item.photo == true" | sort: "date" | reverse %}
    {% for photo in photos %}
    <a class="card" href="{{ photo.url | relative_url }}">
        <h2 class="details">{{ photo.title | escape }}</h2>
        <img class="thumbnail" loading="lazy" src="{{ photo.image_path | relative_url }}" alt="{{ photo.title | escape }}">
    </a>
    {% endfor %}
</div>
