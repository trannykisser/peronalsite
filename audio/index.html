---
layout: default
title: audio
index: true
---
<ul class="index">
{% for audio in site.static_files %}
    {% if audio.path contains 'audio/' %}
    <li>
        <h2>{{ audio.basename }}</h2>
        <p><em>{{ audio.modified_time | date: "%B %d, %Y" }}</em></p>
        <!-- <p>{{ audio.description }}</p> -->
        <audio controls>
            <source src="{{ audio.path | relative_url }}" type="audio/wav">
            Your browser does not support the audio element.
        </audio>
    </li>
    {% endif %}
{% endfor %}
</ul>
