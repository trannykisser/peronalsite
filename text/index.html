---
layout: default
title: text
index: true
---
<ul class="index">
{% for text in site.pages %}
    {% if text.path contains 'text/' and text.index != true %}
    <li>
        <h2><a href="{{ text.url | relative_url }}">{{ text.title }}</a></h2>
        <p><em>{{ text.date | date: "%B %d, %Y" }}</em></p>
        <p>{{ text.description }}</p>
    </li>
    {% endif %}
{% endfor %}
</ul>
